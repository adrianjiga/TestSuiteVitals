name: Bug report
description: Something in suitevitals is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Before you start, please run
        `suitevitals --version` (the copy you ran, not `npx`, which fetches the
        latest release) so we know exactly which version you had.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
      placeholder: report ranked a consistently failing test as flaky...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, with their flags. Replace private repo names if you need to.
      placeholder: |
        1. `suitevitals collect --repo owner/name --hours-back 168`
        2. `suitevitals report --repo owner/name`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: suitevitals version
      description: Output of `suitevitals --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      description: e.g. Node 24.22.3 on Ubuntu 24.04, Node 26.1.0 on macOS 15
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command
      description: Which command shows the problem
      multiple: true
      options:
        - collect
        - report
        - dashboard
        - compact
        - prune
        - doctor
  - type: dropdown
    id: format
    attributes:
      label: Report format
      description: The test report your CI uploads
      multiple: true
      options:
        - JUnit XML
        - Playwright blob report
        - Mochawesome JSON
        - Other / not sure
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >-
        Paste the command output around the failure as text. Run it again with
        `SUITEVITALS_DEBUG=1` to include the stack trace. Check it for tokens or
        private repo details before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This is not a duplicate of an existing issue
          required: false
