name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; a compromised dependency or script must not inherit a write token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on known-vulnerable production dependencies (dev-only advisories don't block).
      - run: npm audit --omit=dev --audit-level=high
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
