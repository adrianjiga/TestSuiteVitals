name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; a compromised dependency or script must not inherit a write token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on known-vulnerable production dependencies (dev-only advisories don't block).
      - run: npm audit --omit=dev --audit-level=high
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
